```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Downhill Game</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        background: #222;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #game {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: linear-gradient(#87ceeb 0%, #dff6ff 45%, #8bc34a 46%, #4caf50 100%);
    }

    /* JALAN */
    #road {
        position: absolute;
        width: 55%;
        height: 150%;
        left: 22.5%;
        top: -20%;
        background: #b7b7b7;
        transform: perspective(500px) rotateX(12deg);
        border-left: 8px solid #fff;
        border-right: 8px solid #fff;
    }

    /* SALJU / TANAH */
    .snow {
        position: absolute;
        width: 100%;
        height: 100%;
        pointer-events: none;
    }

    /* PEMAIN */
    #player {
        position: absolute;
        width: 55px;
        height: 75px;
        bottom: 90px;
        left: calc(50% - 27px);
        z-index: 10;
        transition: transform 0.08s;
    }

    .body {
        position: absolute;
        width: 32px;
        height: 42px;
        background: #1976d2;
        border-radius: 12px;
        left: 11px;
        top: 20px;
    }

    .head {
        position: absolute;
        width: 28px;
        height: 28px;
        background: #ffd1a4;
        border-radius: 50%;
        left: 14px;
        top: 0;
    }

    .board {
        position: absolute;
        width: 65px;
        height: 8px;
        background: #ff9800;
        border-radius: 10px;
        bottom: 0;
        left: -5px;
        transform: rotate(-5deg);
    }

    /* RINTANGAN */
    .rock {
        position: absolute;
        width: 45px;
        height: 35px;
        background: #555;
        border-radius: 50% 50% 40% 40%;
        z-index: 5;
    }

    .tree {
        position: absolute;
        width: 35px;
        height: 70px;
        z-index: 5;
    }

    .tree::before {
        content: "";
        position: absolute;
        width: 0;
        height: 0;
        border-left: 25px solid transparent;
        border-right: 25px solid transparent;
        border-bottom: 55px solid #087f23;
        left: -8px;
        top: 0;
    }

    .tree::after {
        content: "";
        position: absolute;
        width: 10px;
        height: 25px;
        background: #704214;
        left: 12px;
        bottom: 0;
    }

    /* UI */
    #score {
        position: absolute;
        top: 20px;
        left: 20px;
        color: white;
        font-size: 25px;
        font-weight: bold;
        z-index: 100;
        text-shadow: 2px 2px 3px #000;
    }

    #speed {
        position: absolute;
        top: 55px;
        left: 20px;
        color: white;
        font-size: 18px;
        z-index: 100;
        text-shadow: 2px 2px 3px #000;
    }

    #gameOver {
        display: none;
        position: absolute;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.7);
        z-index: 200;
        color: white;
        justify-content: center;
        align-items: center;
        flex-direction: column;
    }

    #gameOver h1 {
        font-size: 50px;
        margin-bottom: 20px;
    }

    button {
        padding: 14px 30px;
        border: none;
        border-radius: 25px;
        background: #ff9800;
        color: white;
        font-size: 18px;
        cursor: pointer;
    }

    button:hover {
        background: #f57c00;
    }

    #controls {
        position: absolute;
        bottom: 20px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 20px;
        z-index: 100;
    }

    .control {
        width: 65px;
        height: 65px;
        border-radius: 50%;
        border: none;
        background: rgba(0,0,0,0.45);
        font-size: 30px;
        color: white;
    }

    @media (min-width: 800px) {
        #controls {
            display: none;
        }
    }
</style>
</head>

<body>

<div id="game">

    <div id="road"></div>

    <div id="score">Skor: 0</div>
    <div id="speed">Kecepatan: 1x</div>

    <!-- PEMAIN -->
    <div id="player">
        <div class="head"></div>
        <div class="body"></div>
        <div class="board"></div>
    </div>

    <!-- GAME OVER -->
    <div id="gameOver">
        <h1>GAME OVER</h1>
        <p id="finalScore">Skor: 0</p>
        <br>
        <button onclick="restartGame()">MAIN LAGI</button>
    </div>

    <!-- KONTROL HP -->
    <div id="controls">
        <button class="control" id="left">←</button>
        <button class="control" id="right">→</button>
    </div>

</div>

<script>

const game = document.getElementById("game");
const player = document.getElementById("player");

const scoreText = document.getElementById("score");
const speedText = document.getElementById("speed");

const gameOverScreen = document.getElementById("gameOver");
const finalScore = document.getElementById("finalScore");

let playerX = window.innerWidth / 2 - 27;
let score = 0;
let speed = 5;
let gameRunning = true;

let leftPressed = false;
let rightPressed = false;

let obstacles = [];


/* =========================
   KONTROL KEYBOARD
========================= */

document.addEventListener("keydown", function(e) {

    if (e.key === "ArrowLeft" || e.key === "a") {
        leftPressed = true;
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        rightPressed = true;
    }

});

document.addEventListener("keyup", function(e) {

    if (e.key === "ArrowLeft" || e.key === "a") {
        leftPressed = false;
    }

    if (e.key === "ArrowRight" || e.key === "d") {
        rightPressed = false;
    }

});


/* =========================
   KONTROL HP
========================= */

const leftButton = document.getElementById("left");
const rightButton = document.getElementById("right");

leftButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    leftPressed = true;
});

leftButton.addEventListener("touchend", function() {
    leftPressed = false;
});

rightButton.addEventListener("touchstart", function(e) {
    e.preventDefault();
    rightPressed = true;
});

rightButton.addEventListener("touchend", function() {
    rightPressed = false;
});


/* =========================
   GERAK PEMAIN
========================= */

function movePlayer() {

    if (!gameRunning) return;

    if (leftPressed) {
        playerX -= 7;
        player.style.transform = "rotate(-12deg)";
    }

    else if (rightPressed) {
        playerX += 7;
        player.style.transform = "rotate(12deg)";
    }

    else {
        player.style.transform = "rotate(0deg)";
    }

    // Batas layar
    if (playerX < 0) {
        playerX = 0;
    }

    if (playerX > window.innerWidth - 55) {
        playerX = window.innerWidth - 55;
    }

    player.style.left = playerX + "px";
}


/* =========================
   BUAT RINTANGAN
========================= */

function createObstacle() {

    if (!gameRunning) return;

    const obstacle = document.createElement("div");

    const type = Math.random();

    if (type > 0.5) {
        obstacle.classList.add("rock");
    } else {
        obstacle.classList.add("tree");
    }

    obstacle.style.left =
        (window.innerWidth * 0.25 +
        Math.random() * window.innerWidth * 0.5) + "px";

    obstacle.style.top = "-100px";

    game.appendChild(obstacle);

    obstacles.push({
        element: obstacle,
        y: -100
    });
}


/* =========================
   GERAK RINTANGAN
========================= */

function updateObstacles() {

    for (let i = obstacles.length - 1; i >= 0; i--) {

        let obs = obstacles[i];

        obs.y += speed;

        obs.element.style.top = obs.y + "px";

        // Jika melewati layar
        if (obs.y > window.innerHeight + 100) {

            obs.element.remove();
            obstacles.splice(i, 1);

            score++;

            scoreText.innerText = "Skor: " + score;

            // Tambah kecepatan
            if (score % 10 === 0) {
                speed += 0.5;

                speedText.innerText =
                    "Kecepatan: " + speed.toFixed(1) + "x";
            }

            continue;
        }

        checkCollision(obs.element);
    }
}


/* =========================
   CEK TABRAKAN
========================= */

function checkCollision(obstacle) {

    const p = player.getBoundingClientRect();
    const o = obstacle.getBoundingClientRect();

    const collision =
        p.left < o.right &&
        p.right > o.left &&
        p.top < o.bottom &&
        p.bottom > o.top;

    if (collision) {
        endGame();
    }
}


/* =========================
   GAME OVER
========================= */

function endGame() {

    gameRunning = false;

    finalScore.innerText =
        "Skor akhir: " + score;

    gameOverScreen.style.display = "flex";
}


/* =========================
   RESTART
========================= */

function restartGame() {

    obstacles.forEach(obs => {
        obs.element.remove();
    });

    obstacles = [];

    score = 0;
    speed = 5;

    playerX =
        window.innerWidth / 2 - 27;

    player.style.left =
        playerX + "px";

    scoreText.innerText =
        "Skor: 0";

    speedText.innerText =
        "Kecepatan: 1x";

    gameOverScreen.style.display =
        "none";

    gameRunning = true;
}


/* =========================
   LOOP GAME
========================= */

function gameLoop() {

    movePlayer();
    updateObstacles();

    requestAnimationFrame(gameLoop);
}

gameLoop();


/* =========================
   SPAWN RINTANGAN
========================= */

setInterval(function() {

    if (gameRunning) {
        createObstacle();
    }

}, 900);

</script>

</body>
</html>
