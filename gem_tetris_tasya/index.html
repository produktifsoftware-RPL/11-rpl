<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gem Tetris 3D</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    :root {
      --bg1: #0b1024;
      --bg2: #151a3a;
      --panel: rgba(255,255,255,.08);
      --border: rgba(255,255,255,.14);
      --text: #f7f8ff;
      --muted: #aeb5d5;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background:
        radial-gradient(circle at 20% 15%, rgba(95, 70, 255, .28), transparent 28%),
        radial-gradient(circle at 80% 80%, rgba(0, 210, 255, .18), transparent 30%),
        linear-gradient(145deg, var(--bg1), var(--bg2));
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .15;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size: 40px 40px;
    }

    .game-shell {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 16px;
    }

    .game-layout {
      width: min(1050px, 100%);
      display: grid;
      grid-template-columns: 210px minmax(280px, 420px) 210px;
      align-items: center;
      justify-content: center;
      gap: 22px;
    }

    .glass {
      background: linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035));
      border: 1px solid var(--border);
      box-shadow:
        0 25px 70px rgba(0,0,0,.42),
        inset 0 1px rgba(255,255,255,.1);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 22px;
    }

    .side-panel {
      padding: 18px;
    }

    .brand {
      font-weight: 900;
      letter-spacing: 2px;
      font-size: 1.15rem;
      margin-bottom: 16px;
    }

    .stat {
      background: rgba(0,0,0,.2);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 15px;
      padding: 12px;
      margin-bottom: 10px;
    }

    .stat small {
      color: var(--muted);
      display: block;
      font-size: .72rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat strong {
      font-size: 1.45rem;
    }

    .board-wrap {
      position: relative;
      padding: 14px;
      border-radius: 27px;
      background: linear-gradient(145deg, rgba(255,255,255,.13), rgba(255,255,255,.035));
      border: 1px solid rgba(255,255,255,.17);
      box-shadow:
        0 35px 90px rgba(0,0,0,.5),
        inset 0 2px rgba(255,255,255,.12),
        inset 0 -10px 25px rgba(0,0,0,.15);
      transform: perspective(1000px) rotateX(.8deg);
    }

    #gameCanvas {
      display: block;
      width: 100%;
      max-width: 390px;
      margin: auto;
      aspect-ratio: 10 / 20;
      border-radius: 16px;
      background: #080c1c;
      box-shadow: inset 0 0 35px rgba(0,0,0,.8);
    }

    .mini-title {
      font-size: .75rem;
      color: var(--muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    #nextCanvas {
      width: 100%;
      aspect-ratio: 1;
      background: rgba(0,0,0,.2);
      border-radius: 15px;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 14px;
    }

    .control-btn {
      height: 48px;
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 13px;
      background: linear-gradient(145deg, rgba(255,255,255,.14), rgba(255,255,255,.045));
      color: white;
      font-size: 1.15rem;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(0,0,0,.25), inset 0 1px rgba(255,255,255,.12);
      transition: transform .08s ease, filter .08s ease;
      touch-action: manipulation;
    }

    .control-btn:active {
      transform: translateY(2px) scale(.96);
      filter: brightness(1.25);
    }

    .rotate-btn {
      grid-column: 2;
    }

    .drop-btn {
      grid-column: 1 / 4;
    }

    .hint {
      color: var(--muted);
      font-size: .76rem;
      line-height: 1.55;
      margin-top: 14px;
    }

    .key {
      display: inline-block;
      padding: 2px 6px;
      margin: 1px;
      border-radius: 5px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.13);
      color: white;
      font-size: .7rem;
    }

    .modal-content {
      color: white;
      background: linear-gradient(145deg, #171d42, #0c1029);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 24px;
      box-shadow: 0 30px 90px rgba(0,0,0,.6);
    }

    .modal-title {
      font-weight: 900;
      letter-spacing: 1px;
    }

    .btn-neon {
      border: 0;
      color: white;
      font-weight: 800;
      border-radius: 13px;
      padding: 11px 22px;
      background: linear-gradient(135deg, #6d5cff, #00b7ff);
      box-shadow: 0 10px 28px rgba(58,116,255,.3);
    }

    @media (max-width: 850px) {
      .game-layout {
        grid-template-columns: 1fr minmax(280px, 390px) 1fr;
        gap: 10px;
      }
      .side-panel { padding: 12px; }
      .left-panel { grid-column: 1; }
      .right-panel { grid-column: 3; }
    }

    @media (max-width: 650px) {
      .game-shell { padding: 12px; align-items: flex-start; }
      .game-layout {
        grid-template-columns: 1fr 1fr;
        align-items: start;
      }
      .board-wrap {
        grid-column: 1 / 3;
        grid-row: 1;
      }
      .left-panel {
        grid-column: 1;
        grid-row: 2;
      }
      .right-panel {
        grid-column: 2;
        grid-row: 2;
      }
    }

    @media (max-width: 430px) {
      .side-panel { padding: 11px; border-radius: 16px; }
      .brand { font-size: .95rem; }
      .stat { padding: 9px; }
      .stat strong { font-size: 1.15rem; }
      .hint { font-size: .68rem; }
    }
  </style>
</head>

<body>
  <main class="game-shell">
    <section class="game-layout">

      <!-- PANEL KIRI -->
      <aside class="glass side-panel left-panel">
        <div class="brand">💎 GEM TETRIS</div>

        <div class="stat">
          <small>Score</small>
          <strong id="score">0</strong>
        </div>

        <div class="stat">
          <small>Lines</small>
          <strong id="lines">0</strong>
        </div>

        <div class="stat">
          <small>Level</small>
          <strong id="level">1</strong>
        </div>

        <button class="btn btn-sm btn-outline-light w-100 mt-2" id="pauseBtn">
          ⏸ Pause
        </button>
      </aside>

      <!-- PAPAN -->
      <div class="board-wrap">
        <canvas id="gameCanvas" width="300" height="600"></canvas>
      </div>

      <!-- PANEL KANAN -->
      <aside class="glass side-panel right-panel">
        <div class="mini-title">Next Gem</div>
        <canvas id="nextCanvas" width="170" height="170"></canvas>

        <div class="controls">
          <button class="control-btn" id="leftBtn" aria-label="Kiri">◀</button>
          <button class="control-btn rotate-btn" id="rotateBtn" aria-label="Putar">↻</button>
          <button class="control-btn" id="rightBtn" aria-label="Kanan">▶</button>
          <button class="control-btn drop-btn" id="downBtn" aria-label="Turun">▼ TURUN</button>
        </div>

        <div class="hint">
          <div><span class="key">←</span> <span class="key">→</span> geser</div>
          <div><span class="key">↓</span> turun</div>
          <div><span class="key">SPACE</span> putar pola</div>
        </div>
      </aside>

    </section>
  </main>

  <!-- POPUP START -->
  <div class="modal fade" id="startModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <div class="modal-body">
          <div style="font-size:4rem">💎</div>
          <h2 class="modal-title mb-2">GEM TETRIS</h2>
          <p class="text-secondary mb-4">Susun gem sebanyak mungkin. Jangan sampai menumpuk sampai atas!</p>
          <button class="btn-neon" id="startBtn">🚀 MULAI GAME</button>
        </div>
      </div>
    </div>
  </div>

  <!-- POPUP GAME OVER -->
  <div class="modal fade" id="gameOverModal" tabindex="-1" data-bs-backdrop="static" data-bs-keyboard="false">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-center p-4">
        <div class="modal-body">
          <div style="font-size:4rem">💥</div>
          <h2 class="modal-title mb-2">GAME OVER</h2>
          <p class="text-secondary">Gem sudah sampai ke atas.</p>
          <div class="row g-2 mb-4">
            <div class="col">
              <div class="stat mb-0">
                <small>Score</small>
                <strong id="finalScore">0</strong>
              </div>
            </div>
            <div class="col">
              <div class="stat mb-0">
                <small>Lines</small>
                <strong id="finalLines">0</strong>
              </div>
            </div>
          </div>
          <button class="btn-neon" id="restartBtn">🔄 MAIN LAGI</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const nextCanvas = document.getElementById("nextCanvas");
    const nextCtx = nextCanvas.getContext("2d");

    const COLS = 10;
    const ROWS = 20;
    const CELL = canvas.width / COLS;

    const colors = [
      null,
      "#00e5ff", // I
      "#4f7cff", // J
      "#ff9f1c", // L
      "#ffe047", // O
      "#35e67b", // S
      "#bd5cff", // T
      "#ff4d78"  // Z
    ];

    const shapes = [
      [[1,1,1,1]],
      [[2,0,0],[2,2,2]],
      [[0,0,3],[3,3,3]],
      [[4,4],[4,4]],
      [[0,5,5],[5,5,0]],
      [[0,6,0],[6,6,6]],
      [[7,7,0],[0,7,7]]
    ];

    let board = createBoard();
    let piece = null;
    let nextPiece = null;

    let score = 0;
    let lines = 0;
    let level = 1;

    let dropInterval = 850;
    let dropCounter = 0;
    let lastTime = 0;
    let running = false;
    let paused = false;
    let rafId = null;

    const startModal = new bootstrap.Modal(document.getElementById("startModal"));
    const gameOverModal = new bootstrap.Modal(document.getElementById("gameOverModal"));

    function createBoard() {
      return Array.from({ length: ROWS }, () => Array(COLS).fill(0));
    }

    function randomPiece() {
      const index = Math.floor(Math.random() * shapes.length);
      return {
        matrix: shapes[index].map(row => [...row]),
        x: Math.floor(COLS / 2) - Math.ceil(shapes[index][0].length / 2),
        y: 0
      };
    }

    function resetGame() {
      board = createBoard();
      score = 0;
      lines = 0;
      level = 1;
      dropInterval = 850;
      dropCounter = 0;
      piece = randomPiece();
      nextPiece = randomPiece();
      paused = false;
      running = true;

      updateStats();
      drawNext();
      lastTime = performance.now();

      if (rafId) cancelAnimationFrame(rafId);
      rafId = requestAnimationFrame(update);
    }

    function collide(testPiece = piece, offsetX = 0, offsetY = 0, matrix = testPiece.matrix) {
      for (let y = 0; y < matrix.length; y++) {
        for (let x = 0; x < matrix[y].length; x++) {
          if (!matrix[y][x]) continue;

          const nx = testPiece.x + x + offsetX;
          const ny = testPiece.y + y + offsetY;

          if (nx < 0 || nx >= COLS || ny >= ROWS) return true;
          if (ny >= 0 && board[ny][nx]) return true;
        }
      }
      return false;
    }

    function merge() {
      piece.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value && piece.y + y >= 0) {
            board[piece.y + y][piece.x + x] = value;
          }
        });
      });
    }

    function clearLines() {
      let cleared = 0;

      outer:
      for (let y = ROWS - 1; y >= 0; y--) {
        for (let x = 0; x < COLS; x++) {
          if (!board[y][x]) continue outer;
        }

        board.splice(y, 1);
        board.unshift(Array(COLS).fill(0));
        cleared++;
        y++;
      }

      if (cleared) {
        const points = [0, 100, 300, 500, 800];
        score += points[cleared] * level;
        lines += cleared;
        level = Math.floor(lines / 10) + 1;
        dropInterval = Math.max(90, 850 - (level - 1) * 65);
        updateStats();
      }
    }

    function lockPiece() {
      merge();
      clearLines();

      piece = nextPiece;
      piece.x = Math.floor(COLS / 2) - Math.ceil(piece.matrix[0].length / 2);
      piece.y = 0;

      nextPiece = randomPiece();
      drawNext();

      if (collide()) endGame();
    }

    function move(dx) {
      if (!running || paused) return;
      if (!collide(piece, dx, 0)) {
        piece.x += dx;
      }
    }

    function softDrop() {
      if (!running || paused) return;

      if (!collide(piece, 0, 1)) {
        piece.y++;
        score += 1;
        updateStats();
      } else {
        lockPiece();
      }

      dropCounter = 0;
    }

    function hardDrop() {
      if (!running || paused) return;

      let distance = 0;
      while (!collide(piece, 0, distance + 1)) distance++;

      piece.y += distance;
      score += distance * 2;
      updateStats();
      lockPiece();
      dropCounter = 0;
    }

    function rotateMatrix(matrix) {
      const result = matrix[0].map((_, i) =>
        matrix.map(row => row[i]).reverse()
      );
      return result;
    }

    function rotate() {
      if (!running || paused) return;

      const rotated = rotateMatrix(piece.matrix);
      const kicks = [0, -1, 1, -2, 2];

      for (const kick of kicks) {
        if (!collide(piece, kick, 0, rotated)) {
          piece.x += kick;
          piece.matrix = rotated;
          return;
        }
      }
    }

    function drawCell(context, x, y, size, value, alpha = 1) {
      if (!value) return;

      const color = colors[value];
      const px = x * size;
      const py = y * size;

      context.save();
      context.globalAlpha = alpha;

      // 3D gem body
      const grad = context.createLinearGradient(px, py, px + size, py + size);
      grad.addColorStop(0, "#ffffff");
      grad.addColorStop(.12, color);
      grad.addColorStop(.65, color);
      grad.addColorStop(1, "#050812");

      context.fillStyle = grad;
      context.beginPath();
      context.roundRect(px + 2, py + 2, size - 4, size - 4, Math.max(4, size * .13));
      context.fill();

      // inner shine
      context.fillStyle = "rgba(255,255,255,.22)";
      context.beginPath();
      context.roundRect(px + size*.16, py + size*.12, size*.28, size*.13, 3);
      context.fill();

      // lower shadow
      context.fillStyle = "rgba(0,0,0,.25)";
      context.beginPath();
      context.roundRect(px + size*.14, py + size*.77, size*.72, size*.08, 3);
      context.fill();

      context.strokeStyle = "rgba(255,255,255,.28)";
      context.lineWidth = 1;
      context.stroke();

      context.restore();
    }

    function drawGrid() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const bg = ctx.createLinearGradient(0, 0, 0, canvas.height);
      bg.addColorStop(0, "#0d1230");
      bg.addColorStop(1, "#050816");
      ctx.fillStyle = bg;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          ctx.fillStyle = "rgba(255,255,255,.025)";
          ctx.fillRect(x * CELL + 1, y * CELL + 1, CELL - 2, CELL - 2);

          ctx.strokeStyle = "rgba(255,255,255,.035)";
          ctx.strokeRect(x * CELL, y * CELL, CELL, CELL);
        }
      }
    }

    function drawBoard() {
      drawGrid();

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          drawCell(ctx, x, y, CELL, board[y][x]);
        }
      }

      if (piece) {
        // Ghost piece
        let ghostY = piece.y;
        while (!collide(piece, 0, ghostY - piece.y + 1)) ghostY++;

        piece.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) drawCell(ctx, piece.x + x, ghostY + y, CELL, value, .13);
          });
        });

        piece.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) drawCell(ctx, piece.x + x, piece.y + y, CELL, value);
          });
        });
      }
    }

    function drawNext() {
      nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);

      const bg = nextCtx.createLinearGradient(0, 0, 0, 170);
      bg.addColorStop(0, "#101637");
      bg.addColorStop(1, "#080c20");
      nextCtx.fillStyle = bg;
      nextCtx.fillRect(0, 0, 170, 170);

      const matrix = nextPiece.matrix;
      const size = 31;
      const offsetX = (170 - matrix[0].length * size) / 2;
      const offsetY = (170 - matrix.length * size) / 2;

      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (!value) return;

          const px = offsetX / size + x;
          const py = offsetY / size + y;
          drawCell(nextCtx, px, py, size, value);
        });
      });
    }

    function updateStats() {
      document.getElementById("score").textContent = score.toLocaleString("id-ID");
      document.getElementById("lines").textContent = lines;
      document.getElementById("level").textContent = level;
    }

    function update(time = 0) {
      if (!running) return;

      const delta = time - lastTime;
      lastTime = time;

      if (!paused) {
        dropCounter += delta;

        if (dropCounter > dropInterval) {
          if (!collide(piece, 0, 1)) {
            piece.y++;
          } else {
            lockPiece();
          }
          dropCounter = 0;
        }

        drawBoard();
      }

      rafId = requestAnimationFrame(update);
    }

    function endGame() {
      running = false;
      document.getElementById("finalScore").textContent = score.toLocaleString("id-ID");
      document.getElementById("finalLines").textContent = lines;

      setTimeout(() => gameOverModal.show(), 150);
    }

    function togglePause() {
      if (!running) return;

      paused = !paused;
      document.getElementById("pauseBtn").textContent = paused ? "▶ Lanjut" : "⏸ Pause";
    }

    // Keyboard
    document.addEventListener("keydown", e => {
      if (!running) return;

      if (["ArrowLeft","ArrowRight","ArrowDown"," "].includes(e.key)) {
        e.preventDefault();
      }

      if (e.key === "ArrowLeft") move(-1);
      else if (e.key === "ArrowRight") move(1);
      else if (e.key === "ArrowDown") softDrop();
      else if (e.key === " ") rotate();
      else if (e.key.toLowerCase() === "p") togglePause();
    });

    // Tombol layar
    document.getElementById("leftBtn").addEventListener("click", () => move(-1));
    document.getElementById("rightBtn").addEventListener("click", () => move(1));
    document.getElementById("downBtn").addEventListener("click", softDrop);
    document.getElementById("rotateBtn").addEventListener("click", rotate);
    document.getElementById("pauseBtn").addEventListener("click", togglePause);

    // Support tombol tahan untuk geser/turun
    function repeatButton(id, action) {
      const btn = document.getElementById(id);
      let timer = null;

      const start = e => {
        e.preventDefault();
        action();
        timer = setInterval(action, 85);
      };

      const stop = () => {
        clearInterval(timer);
        timer = null;
      };

      btn.addEventListener("pointerdown", start);
      btn.addEventListener("pointerup", stop);
      btn.addEventListener("pointerleave", stop);
      btn.addEventListener("pointercancel", stop);
    }

    repeatButton("leftBtn", () => move(-1));
    repeatButton("rightBtn", () => move(1));
    repeatButton("downBtn", softDrop);

    // Modal
    document.getElementById("startBtn").addEventListener("click", () => {
      startModal.hide();
      resetGame();
    });

    document.getElementById("restartBtn").addEventListener("click", () => {
      gameOverModal.hide();
      setTimeout(resetGame, 250);
    });

    // Tampilan awal
    piece = randomPiece();
    nextPiece = randomPiece();
    updateStats();
    drawNext();
    drawBoard();
    startModal.show();
  </script>
</body>
</html>
