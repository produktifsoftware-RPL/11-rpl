<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Tetris</title>

    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background:
                radial-gradient(circle at top, #263b68 0%, #111827 45%, #05070d 100%);
            color: white;
            overflow: hidden;
        }

        .game-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
        }

        .game-card {
            width: min(1050px, 95vw);
            min-height: 720px;
            padding: 25px;
            border-radius: 28px;

            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255,255,255,0.18);

            box-shadow:
                0 30px 80px rgba(0,0,0,0.55),
                inset 0 1px 1px rgba(255,255,255,0.2);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            transform: perspective(1200px) rotateX(1deg);
        }

        .title {
            text-align: center;
            font-size: 42px;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow:
                0 4px 0 #111,
                0 8px 20px rgba(0,0,0,.6);
            margin-bottom: 20px;
        }

        .game-area {
            display: flex;
            justify-content: center;
            align-items: stretch;
            gap: 30px;
            height: 590px;
        }

        
        .side-panel {
            width: 230px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 15px;
        }

        .panel-box {
            background: linear-gradient(
                145deg,
                rgba(255,255,255,.14),
                rgba(255,255,255,.04)
            );

            border-radius: 20px;
            padding: 20px;

            border: 1px solid rgba(255,255,255,.15);

            box-shadow:
                0 12px 25px rgba(0,0,0,.3),
                inset 0 1px 1px rgba(255,255,255,.15);

            transform: perspective(700px) rotateY(-2deg);
        }

        .panel-title {
            font-size: 14px;
            color: #9ca3af;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .score {
            font-size: 36px;
            font-weight: bold;
            color: #60a5fa;
            text-shadow: 0 0 15px rgba(96,165,250,.7);
        }

        .level {
            font-size: 28px;
            font-weight: bold;
            color: #facc15;
        }

        .next-container {
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #nextCanvas {
            width: 130px;
            height: 130px;
        }

        /* BOARD */
        .board-container {
            position: relative;
            height: 590px;
            width: 330px;

            padding: 12px;

            border-radius: 22px;

            background: linear-gradient(
                145deg,
                #26324d,
                #111827
            );

            box-shadow:
                0 25px 45px rgba(0,0,0,.55),
                inset 0 0 0 2px rgba(255,255,255,.1),
                inset 0 0 25px rgba(0,0,0,.7);

            transform:
                perspective(1000px)
                rotateY(0deg)
                translateZ(20px);
        }

        #gameCanvas {
            width: 100%;
            height: 100%;
            display: block;

            border-radius: 12px;

            background:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                #080d18;

            background-size: 30px 30px;

            box-shadow:
                inset 0 0 30px rgba(0,0,0,.8);
        }

        /* RIGHT PANEL */
        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 15px;
        }

        .control-btn {
            height: 48px;
            border: none;
            border-radius: 12px;

            color: white;
            font-weight: bold;

            background: linear-gradient(
                145deg,
                #374151,
                #111827
            );

            box-shadow:
                0 5px 0 #05070b,
                0 8px 15px rgba(0,0,0,.4);

            transition: .1s;
        }

        .control-btn:active {
            transform: translateY(4px);
            box-shadow:
                0 1px 0 #05070b;
        }

        .space-btn {
            grid-column: span 3;
            background: linear-gradient(
                145deg,
                #2563eb,
                #1e3a8a
            );
        }

        .restart-btn {
            width: 100%;
            border: none;
            padding: 12px;
            border-radius: 12px;

            font-weight: bold;
            color: white;

            background: linear-gradient(
                145deg,
                #16a34a,
                #166534
            );

            box-shadow: 0 5px 0 #052e16;
        }

        
        .modal-overlay {
            position: fixed;
            inset: 0;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0,0,0,.72);
            backdrop-filter: blur(8px);

            z-index: 1000;
        }

        .modal-box {
            width: 420px;
            max-width: 90%;

            padding: 35px;
            border-radius: 25px;

            text-align: center;

            background:
                linear-gradient(
                    145deg,
                    rgba(39,52,80,.98),
                    rgba(12,18,30,.98)
                );

            border: 1px solid rgba(255,255,255,.2);

            box-shadow:
                0 30px 80px rgba(0,0,0,.7),
                inset 0 1px 1px rgba(255,255,255,.15);

            animation: popup .35s ease;
        }

        @keyframes popup {
            from {
                opacity: 0;
                transform: scale(.7) translateY(30px);
            }
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .modal-title {
            font-size: 38px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .modal-text {
            color: #cbd5e1;
            margin-bottom: 25px;
        }

        .start-btn {
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 14px;

            color: white;
            font-size: 18px;
            font-weight: bold;

            background: linear-gradient(
                145deg,
                #3b82f6,
                #1d4ed8
            );

            box-shadow: 0 6px 0 #172554;
        }

        .hidden {
            display: none !important;
        }

        .key {
            display: inline-flex;
            min-width: 30px;
            height: 28px;
            padding: 0 7px;
            align-items: center;
            justify-content: center;

            border-radius: 7px;
            background: #1f2937;
            border: 1px solid #4b5563;

            font-size: 12px;
            font-weight: bold;
        }

        @media(max-width: 900px) {
            body {
                overflow: auto;
            }

            .game-wrapper {
                align-items: flex-start;
            }

            .game-card {
                min-height: auto;
            }

            .game-area {
                height: auto;
                flex-direction: column;
                align-items: center;
            }

            .side-panel {
                width: 100%;
                max-width: 330px;
            }

            .board-container {
                order: -1;
            }

            .title {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

<div class="game-wrapper">

    <div class="game-card">

        <div class="title">
            TETRIS 3D
        </div>

        <div class="game-area">

            <!-- PANEL KIRI -->
            <div class="side-panel">

                <div class="panel-box">
                    <div class="panel-title">Score</div>
                    <div id="score" class="score">0</div>

                    <hr>

                    <div class="panel-title">Level</div>
                    <div id="level" class="level">1</div>

                    <hr>

                    <div class="panel-title">Lines</div>
                    <div id="lines">0</div>
                </div>

                <div class="panel-box">
                    <div class="panel-title text-center">
                        Next Block
                    </div>

                    <div class="next-container">
                        <canvas id="nextCanvas"
                                width="130"
                                height="130">
                        </canvas>
                    </div>
                </div>

            </div>

            
            <div class="board-container">
                <canvas id="gameCanvas"
                        width="300"
                        height="570">
                </canvas>
            </div>

            
            <div class="side-panel">

                <div class="panel-box">

                    <div class="panel-title">
                        Controls
                    </div>

                    <div class="controls">

                        <button class="control-btn"
                                id="leftBtn">
                            ←
                        </button>

                        <button class="control-btn"
                                id="downBtn">
                            ↓
                        </button>

                        <button class="control-btn"
                                id="rightBtn">
                            →
                        </button>

                        <button class="control-btn space-btn"
                                id="rotateBtn">
                            SPACE — ROTATE
                        </button>

                    </div>

                    <div class="mt-3 text-center small text-secondary">
                        <span class="key">←</span>
                        Geser kiri
                        <br><br>

                        <span class="key">→</span>
                        Geser kanan
                        <br><br>

                        <span class="key">↓</span>
                        Turun
                        <br><br>

                        <span class="key">SPACE</span>
                        Putar blok
                    </div>

                </div>

                <div class="panel-box">

                    <div class="panel-title">
                        Game
                    </div>

                    <button class="restart-btn"
                            id="restartBtn">
                        ↻ Restart
                    </button>

                </div>

            </div>

        </div>

    </div>
</div>


<!-- POPUP START / GAME OVER -->
<div id="gameModal" class="modal-overlay">

    <div class="modal-box">

        <div id="modalTitle"
             class="modal-title">
            TETRIS 3D
        </div>

        <div id="modalText"
             class="modal-text">
            Siap untuk bermain?
        </div>

        <div class="mb-3">
            Score:
            <strong id="modalScore">0</strong>
        </div>

        <button id="startBtn"
                class="start-btn">
            ▶ MULAI GAME
        </button>

    </div>

</div>


<script>

    
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const nextCanvas = document.getElementById("nextCanvas");
    const nextCtx = nextCanvas.getContext("2d");


    
    const COLS = 10;
    const ROWS = 19;
    const BLOCK = 30;

    let board = [];

    function createBoard() {

        board = [];

        for (let y = 0; y < ROWS; y++) {

            board.push(
                new Array(COLS).fill(0)
            );

        }

    }


    
    const pieces = [

        {
            name: "I",
            color: "#06b6d4",
            shape: [
                [1,1,1,1]
            ]
        },

        {
            name: "O",
            color: "#facc15",
            shape: [
                [1,1],
                [1,1]
            ]
        },

        {
            name: "T",
            color: "#a855f7",
            shape: [
                [0,1,0],
                [1,1,1]
            ]
        },

        {
            name: "S",
            color: "#22c55e",
            shape: [
                [0,1,1],
                [1,1,0]
            ]
        },

        {
            name: "Z",
            color: "#ef4444",
            shape: [
                [1,1,0],
                [0,1,1]
            ]
        },

        {
            name: "J",
            color: "#3b82f6",
            shape: [
                [1,0,0],
                [1,1,1]
            ]
        },

        {
            name: "L",
            color: "#f97316",
            shape: [
                [0,0,1],
                [1,1,1]
            ]
        }

    ];


    

    let player = null;
    let nextPiece = null;

    let score = 0;
    let lines = 0;
    let level = 1;

    let running = false;

    let dropCounter = 0;
    let lastTime = 0;

    let dropInterval = 800;


    

    function randomPiece() {

        const index =
            Math.floor(Math.random() * pieces.length);

        const piece = pieces[index];

        return {
            name: piece.name,
            color: piece.color,
            shape: piece.shape.map(row => [...row]),
            x: 0,
            y: 0
        };

    }


    

    function createPlayer() {

        player = nextPiece || randomPiece();

        nextPiece = randomPiece();

        player.x =
            Math.floor(
                COLS / 2 -
                player.shape[0].length / 2
            );

        player.y = 0;

        drawNext();

        if (collision()) {

            gameOver();

        }

    }


    

    function collision() {

        const shape = player.shape;

        for (let y = 0; y < shape.length; y++) {

            for (let x = 0; x < shape[y].length; x++) {

                if (!shape[y][x]) continue;

                const boardX =
                    player.x + x;

                const boardY =
                    player.y + y;

                if (
                    boardX < 0 ||
                    boardX >= COLS ||
                    boardY >= ROWS
                ) {

                    return true;

                }

                if (
                    boardY >= 0 &&
                    board[boardY][boardX]
                ) {

                    return true;

                }

            }

        }

        return false;

    }


    

    function merge() {

        player.shape.forEach(
            (row, y) => {

                row.forEach(
                    (value, x) => {

                        if (value) {

                            board[
                                player.y + y
                            ][
                                player.x + x
                            ] =
                            player.color;

                        }

                    }
                );

            }
        );

    }


    
    function rotateMatrix(matrix) {

        return matrix[0].map(
            (_, index) =>
                matrix
                    .map(row => row[index])
                    .reverse()
        );

    }

    function rotatePlayer() {

        const oldShape =
            player.shape;

        player.shape =
            rotateMatrix(player.shape);

        let offset = 1;

        while (collision()) {

            player.x += offset;

            offset =
                -(offset +
                (offset > 0 ? 1 : -1));

            if (
                Math.abs(offset) >
                player.shape[0].length
            ) {

                player.shape =
                    oldShape;

                return;

            }

        }

    }


    
    function move(dir) {

        player.x += dir;

        if (collision()) {

            player.x -= dir;

        }

    }


    

    function drop() {

        player.y++;

        if (collision()) {

            player.y--;

            merge();

            clearLines();

            createPlayer();

        }

        dropCounter = 0;

    }


    function hardDrop() {

        while (!collision()) {

            player.y++;

        }

        player.y--;

        merge();

        clearLines();

        createPlayer();

        dropCounter = 0;

    }


   

    function clearLines() {

        let cleared = 0;

        outer:
        for (
            let y = ROWS - 1;
            y >= 0;
            y--
        ) {

            for (
                let x = 0;
                x < COLS;
                x++
            ) {

                if (!board[y][x]) {

                    continue outer;

                }

            }

            board.splice(y, 1);

            board.unshift(
                new Array(COLS).fill(0)
            );

            cleared++;

            y++;

        }

        if (cleared > 0) {

            const points = [
                0,
                100,
                300,
                500,
                800
            ];

            score +=
                points[cleared] * level;

            lines += cleared;

            level =
                Math.floor(lines / 10) + 1;

            dropInterval =
                Math.max(
                    100,
                    800 - (level - 1) * 70
                );

            updateUI();

        }

    }


    

    function drawBlock(
        context,
        x,
        y,
        size,
        color
    ) {

        const px = x * size;
        const py = y * size;

        
        context.fillStyle = color;

        context.fillRect(
            px + 2,
            py + 2,
            size - 4,
            size - 4
        );


        
        context.fillStyle =
            "rgba(255,255,255,.35)";

        context.fillRect(
            px + 3,
            py + 3,
            size - 6,
            5
        );

        context.fillRect(
            px + 3,
            py + 3,
            5,
            size - 6
        );


        
        context.fillStyle =
            "rgba(0,0,0,.35)";

        context.fillRect(
            px + 5,
            py + size - 7,
            size - 7,
            4
        );

        context.fillRect(
            px + size - 7,
            py + 5,
            4,
            size - 7
        );


        
        context.strokeStyle =
            "rgba(255,255,255,.2)";

        context.lineWidth = 1;

        context.strokeRect(
            px + 2,
            py + 2,
            size - 4,
            size - 4
        );

    }


    

    function draw() {

        ctx.clearRect(
            0,
            0,
            canvas.width,
            canvas.height
        );


       
        for (
            let y = 0;
            y < ROWS;
            y++
        ) {

            for (
                let x = 0;
                x < COLS;
                x++
            ) {

                if (board[y][x]) {

                    drawBlock(
                        ctx,
                        x,
                        y,
                        BLOCK,
                        board[y][x]
                    );

                }

            }

        }


        
        if (player) {

            player.shape.forEach(
                (row, y) => {

                    row.forEach(
                        (value, x) => {

                            if (value) {

                                drawBlock(
                                    ctx,
                                    player.x + x,
                                    player.y + y,
                                    BLOCK,
                                    player.color
                                );

                            }

                        }
                    );

                }
            );

        }

    }


    
    function drawNext() {

        nextCtx.clearRect(
            0,
            0,
            nextCanvas.width,
            nextCanvas.height
        );

        if (!nextPiece) return;

        const shape =
            nextPiece.shape;

        const size = 25;

        const offsetX =
            (130 -
            shape[0].length * size) / 2;

        const offsetY =
            (130 -
            shape.length * size) / 2;


        shape.forEach(
            (row, y) => {

                row.forEach(
                    (value, x) => {

                        if (!value) return;

                        const px =
                            offsetX / size + x;

                        const py =
                            offsetY / size + y;

                        drawBlock(
                            nextCtx,
                            px,
                            py,
                            size,
                            nextPiece.color
                        );

                    }
                );

            }
        );

    }


    
    function updateUI() {

        document.getElementById(
            "score"
        ).textContent = score;

        document.getElementById(
            "lines"
        ).textContent = lines;

        document.getElementById(
            "level"
        ).textContent = level;

    }


    
    function update(time = 0) {

        if (!running) {

            draw();

            requestAnimationFrame(update);

            return;

        }


        const delta =
            time - lastTime;

        lastTime = time;

        dropCounter += delta;


        if (
            dropCounter >
            dropInterval
        ) {

            drop();

        }


        draw();

        requestAnimationFrame(update);

    }


    
    function startGame() {

        createBoard();

        score = 0;
        lines = 0;
        level = 1;

        dropInterval = 800;

        nextPiece = randomPiece();

        createPlayer();

        updateUI();

        running = true;

        document
            .getElementById("gameModal")
            .classList.add("hidden");

        lastTime =
            performance.now();

        dropCounter = 0;

    }


    
    function gameOver() {

        running = false;

        document.getElementById(
            "modalTitle"
        ).textContent =
            "GAME OVER";

        document.getElementById(
            "modalText"
        ).textContent =
            "Permainan selesai! Coba lagi dan pecahkan skor terbaikmu.";

        document.getElementById(
            "modalScore"
        ).textContent =
            score;

        document.getElementById(
            "startBtn"
        ).textContent =
            "↻ MAIN LAGI";

        document
            .getElementById("gameModal")
            .classList.remove("hidden");

    }


    

    document.addEventListener(
        "keydown",
        event => {

            if (!running) return;

            if (
                event.key === "ArrowLeft"
            ) {

                event.preventDefault();

                move(-1);

            }

            else if (
                event.key === "ArrowRight"
            ) {

                event.preventDefault();

                move(1);

            }

            else if (
                event.key === "ArrowDown"
            ) {

                event.preventDefault();

                drop();

            }

            else if (
                event.code === "Space"
            ) {

                event.preventDefault();

                rotatePlayer();

            }

        }
    );


    
    document
        .getElementById("leftBtn")
        .addEventListener(
            "click",
            () => {

                if (running)
                    move(-1);

            }
        );


    document
        .getElementById("rightBtn")
        .addEventListener(
            "click",
            () => {

                if (running)
                    move(1);

            }
        );


    document
        .getElementById("downBtn")
        .addEventListener(
            "click",
            () => {

                if (running)
                    drop();

            }
        );


    document
        .getElementById("rotateBtn")
        .addEventListener(
            "click",
            () => {

                if (running)
                    rotatePlayer();

            }
        );


    document
        .getElementById("restartBtn")
        .addEventListener(
            "click",
            () => {

                startGame();

            }
        );


    document
        .getElementById("startBtn")
        .addEventListener(
            "click",
            () => {

                startGame();

            }
        );


    

    createBoard();

    nextPiece = randomPiece();

    drawNext();

    draw();

    requestAnimationFrame(update);

</script>

</body>
</html>
